name: Keep Streamlit Alive

on:
  schedule:
    # 毎日1回、UTC（協定世界時）の0時（日本時間の朝9時）に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動でもテスト実行できるようにするボタン

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to Streamlit app
        run: |
          curl -I https://27nov-tmu-reunion-questionnaire.streamlit.app/
